<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃太郎の学習サイト | 2ページ目</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Yu Gothic", sans-serif; background: #fff6ed; color: #443027; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #f3dfce; font-weight: 700; }
    main { min-height: calc(100vh - 135px); display: grid; place-items: center; padding: 40px 20px; }
    .card { width: min(100%, 620px); padding: 48px 32px; background: #fff; border-radius: 22px; box-shadow: 0 12px 40px rgba(132,69,20,.10); text-align: center; }
    .label { color: #b45c1a; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(28px, 5vw, 42px); }
    p { line-height: 1.9; }
    .button { display: inline-block; margin-top: 18px; padding: 15px 30px; color: white; background: #b45c1a; text-decoration: none; font-weight: 700; border-radius: 12px; }
    .button:hover { background: #8d410d; }
    code { background: #fff0e3; padding: 3px 6px; border-radius: 5px; }
    footer { text-align: center; color: #8c7160; padding: 22px; font-size: 13px; }
  </style>
</head>
<body>
  <header>桃太郎のWeb学習サイト</header>
  <main>
    <section class="card">
      <div class="label">PAGE 02 / SECOND PAGE</div>
      <h1>2ページ目に到着！</h1>
      <p>おめでとうございます。<br>HTMLの <code>&lt;a href="page2.html"&gt;</code> というリンクで移動できました。</p>
      <p>「戻る」ボタンを押すとトップページに戻れます。</p>
      <a class="button" href="index.html">← トップページに戻る</a>
    </section>
  </main>
  <footer>ページによって背景色が変わることも確認しよう</footer>
</body>
</html>
