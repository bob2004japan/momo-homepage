<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃太郎の学習サイト | トップ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Yu Gothic", sans-serif; background: #edf4ff; color: #23324a; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #dce6f7; font-weight: 700; }
    main { min-height: calc(100vh - 135px); display: grid; place-items: center; padding: 40px 20px; }
    .card { width: min(100%, 620px); padding: 48px 32px; background: #fff; border-radius: 22px; box-shadow: 0 12px 40px rgba(29,72,130,.10); text-align: center; }
    .label { color: #386bd8; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(28px, 5vw, 42px); }
    p { line-height: 1.9; }
    .button { display: inline-block; margin-top: 18px; padding: 15px 30px; color: white; background: #2864d9; text-decoration: none; font-weight: 700; border-radius: 12px; }
    .button:hover { background: #164cac; }
    footer { text-align: center; color: #65758e; padding: 22px; font-size: 13px; }
  </style>
</head>
<body>
  <header>桃太郎のWeb学習サイト</header>
  <main>
    <section class="card">
      <div class="label">PAGE 01 / TOP</div>
      <h1>桃太郎のホームページ</h1>
      <p>これはCloudflare Pagesの学習用サイトです。<br>ボタンをクリックして、2ページ目へ移動してみましょう。</p>
      <a class="button" href="page2.html">2ページ目を見る →</a>
    </section>
  </main>
  <footer>HTMLのページ間リンクを体験しよう</footer>
</body>
</html>
