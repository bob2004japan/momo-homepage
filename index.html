
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃太郎の自己紹介</title>

  <style>
    /* ページ全体 */
    body {
      margin: 0;
      font-family: "Arial", sans-serif;
      background-color: #eaf4ff;
      color: #333;
      line-height: 1.7;
    }

    /* ヘッダー */
    header {
      background-color: #68a8e8;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    /* メインコンテンツ */
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* カード */
    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #00000015;
    }

    h2 {
      color: #3478bd;
      border-bottom: 2px solid #b8d9fa;
      padding-bottom: 8px;
    }

    .character {
      text-align: center;
      font-size: 80px;
    }

    /* フッター */
    footer {
      text-align: center;
      background-color: #68a8e8;
      color: white;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>桃太郎のホームページ</h1>
    <p>鬼退治ならおまかせください！</p>
  </header>

  <main>

    <section>
      <div class="character">🍑</div>
      <h2>はじめまして！</h2>
      <p>
        こんにちは！桃太郎です。<br>
        岡山県出身で、大きな桃から生まれました。
        元気いっぱい、冒険が大好きです！
      </p>
    </section>

    <section>
      <h2>プロフィール</h2>
      <p><strong>名前：</strong>桃太郎</p>
      <p><strong>出身：</strong>岡山県</p>
      <p><strong>好きな食べ物：</strong>きびだんご</p>
      <p><strong>特技：</strong>鬼退治</p>
    </section>

    <section>
      <h2>ぼくの仲間たち</h2>
      <p>🐕 犬：頼れるパートナー</p>
      <p>🐒 猿：頭の回転が速い仲間</p>
      <p>🐦 キジ：空から助けてくれる仲間</p>
    </section>

    <section>
      <h2>将来の夢</h2>
      <p>
        みんなが安心して暮らせる、
        平和な世界をつくることです！
      </p>
    </section>

  </main>

  <footer>
    <p>© 2026 桃太郎のホームページ</p>
  </footer>

</body>
</html>
